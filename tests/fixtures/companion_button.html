<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Glance continuation control fixture</title>
    <style>
      body { font: 18px system-ui; max-width: 720px; margin: 0 auto; padding: 32px; }
      article { min-height: 120px; border-bottom: 1px solid #ccc; padding: 24px 0; }
    </style>
  </head>
  <body>
    <header><h1>Manual continuation feed</h1></header>
    <main id="feed" aria-label="Manual continuation feed"></main>
    <button id="more" type="button">Load more posts</button>
    <script>
      const feed = document.querySelector('#feed');
      let batch = 0;
      function appendBatch() {
        batch += 1;
        for (let item = 1; item <= 4; item += 1) {
          const article = document.createElement('article');
          article.innerHTML = `<h2>Manual batch ${batch} · item ${item}</h2><p>Button-loaded content ${batch}-${item}</p>`;
          feed.append(article);
        }
      }
      appendBatch();
      document.querySelector('#more').addEventListener('click', appendBatch);
    </script>
  </body>
</html>
