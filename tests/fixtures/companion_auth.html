<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Glance sign-in fixture</title>
  </head>
  <body>
    <main>
      <h1>Completing secure sign-in</h1>
      <p>This fixture redirects through the same browser profile.</p>
    </main>
    <script>
      localStorage.setItem('glance-fixture-authenticated', 'yes');
      const requestedTarget = new URLSearchParams(location.search).get('target');
      const target = ['companion_feed.html', 'companion_controls.html'].includes(requestedTarget)
        ? requestedTarget
        : 'companion_feed.html';
      setTimeout(() => location.replace(target), 300);
    </script>
  </body>
</html>
