[workspace]
members = [
  "crates/glance-app",
  "crates/glance-config",
  "crates/glance-net",
  "crates/glance-dom",
  "crates/glance-render",
  "crates/glance-media",
  "crates/glance-ui",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Glance Contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "cookies", "gzip", "brotli", "zstd", "deflate", "system-proxy"] }
reqwest_cookie_store = "0.10.0"
cookie_store = "0.22.1"
encoding_rs = "0.8.35"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
chromiumoxide = "0.9.1"
fs2 = "0.4.3"
futures-util = "0.3.33"
tempfile = "3.27.0"
scraper = "0.27.0"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["bracketed-paste", "osc52"] }
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
base64 = "0.23.0"
imagesize = "0.15.0"
unicode-width = "0.2.2"
